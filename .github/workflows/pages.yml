# Builds the route planner (planner/, Vite) and publishes it at /planner/ beside the static pages,
# which go out as they are. Needs Settings › Pages › Source set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: planner/package-lock.json

      - name: Build the planner
        working-directory: planner
        env:
          # Where the on-device engine streams BRouter's tiles from (navitals-packs' monthly R2 copy).
          # It routes only for a browser that opened the planner with ?engine=local.
          VITE_BROUTER_TILES: https://pub-33efb55f11f54c48b6bf4a5cafb8fbf9.r2.dev/brouter/
        run: |
          npm ci
          npm run build

      - name: Put the site together
        # Only what git tracks, so local notes and screenshots (.gitignore) never go out, and
        # nothing of the planner but its build.
        run: |
          mkdir _site
          git ls-files -z | grep -zv -e '^planner/' -e '^\.github/' -e '^\.gitignore$' \
            | xargs -0 cp --parents -t _site
          cp -r planner/dist _site/planner

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .well-known/apple-app-site-association, which makes a shared route open the app. The
          # only other tracked dotfiles, the .gitignores, never reach _site.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
